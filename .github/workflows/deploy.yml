name: Déployer sur GitHub Pages

# Un projet Astro doit être compilé avant d'être servi : GitHub Pages ne peut
# pas publier les sources telles quelles. Ce workflow lance `astro build` puis
# publie le dossier `dist/`.

on:
  push:
    branches: [main]
  # Permet aussi de relancer le déploiement à la main depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les pushes suivants attendent leur tour
# plutôt que d'annuler une publication en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build
        env:
          # Identifiant du service de logos, utilisé par la page « Votre logo ».
          # Il finit de toute façon dans le HTML servi : c'est une variable de
          # dépôt, pas un secret. Absente, le site se construit quand même et
          # la page invite à saisir un identifiant dans ses réglages avancés.
          # À définir une fois :
          #   gh variable set PUBLIC_CLIENTBRANDFETCH --repo Leto-D/ml-cse --body "…"
          PUBLIC_CLIENTBRANDFETCH: ${{ vars.PUBLIC_CLIENTBRANDFETCH }}

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur Pages
        id: deployment
        uses: actions/deploy-pages@v4
